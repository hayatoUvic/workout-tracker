:root {
  --bg: #f2f3f8;
  --surface: #ffffff;
  --surface-alt: #eef0f6;
  --border: #dde0ea;
  --text: #171923;
  --text-dim: #6b7080;
  --accent: #3a5ce0;
  --accent-soft: #e8ecfc;
  --accent-text: #ffffff;
  --up: #d63763;
  --down: #12897a;
  --flat: #8a8fa0;
  --gold: #b8860f;
  --gold-soft: #fbf1d8;
  --shadow: 0 1px 2px rgba(20, 24, 40, 0.06), 0 8px 24px -16px rgba(20, 24, 40, 0.18);
  --ex-s: 62%;
  --ex-l: 42%;
  --ex-soft-l: 94%;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0c12;
    --surface: #15161f;
    --surface-alt: #1d1f2a;
    --border: #2a2c3a;
    --text: #eef0f8;
    --text-dim: #8b8fa3;
    --accent: #6b8cff;
    --accent-soft: #1c2340;
    --accent-text: #0b0c12;
    --up: #ff6b8a;
    --down: #3ddbc4;
    --flat: #7e8296;
    --gold: #f0c04a;
    --gold-soft: #2e2712;
    --shadow: none;
    --ex-s: 68%;
    --ex-l: 66%;
    --ex-soft-l: 22%;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c12;
  --surface: #15161f;
  --surface-alt: #1d1f2a;
  --border: #2a2c3a;
  --text: #eef0f8;
  --text-dim: #8b8fa3;
  --accent: #6b8cff;
  --accent-soft: #1c2340;
  --accent-text: #0b0c12;
  --up: #ff6b8a;
  --down: #3ddbc4;
  --flat: #7e8296;
  --gold: #f0c04a;
  --gold-soft: #2e2712;
  --shadow: none;
  --ex-s: 68%;
  --ex-l: 66%;
  --ex-soft-l: 22%;
}
:root[data-theme="light"] {
  --bg: #f2f3f8;
  --surface: #ffffff;
  --surface-alt: #eef0f6;
  --border: #dde0ea;
  --text: #171923;
  --text-dim: #6b7080;
  --accent: #3a5ce0;
  --accent-soft: #e8ecfc;
  --accent-text: #ffffff;
  --up: #d63763;
  --down: #12897a;
  --flat: #8a8fa0;
  --gold: #b8860f;
  --gold-soft: #fbf1d8;
  --shadow: 0 1px 2px rgba(20, 24, 40, 0.06), 0 8px 24px -16px rgba(20, 24, 40, 0.18);
  --ex-s: 62%;
  --ex-l: 42%;
  --ex-soft-l: 94%;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  padding-bottom: 56px;
  min-height: 100vh;
}

.app { max-width: 480px; margin: 0 auto; }

.stats-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  padding: 22px 20px 0;
  margin-bottom: 20px;
}
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-value {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.stat-label {
  font-size: 10.5px;
  color: var(--text-dim);
  margin-top: 3px;
  letter-spacing: 0.02em;
}

main { padding: 0 20px; display: flex; flex-direction: column; gap: 22px; }

.input-card {
  background: var(--surface);
  border-radius: 16px;
  padding: 18px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  overflow-x: hidden;
}
.field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.row { display: flex; gap: 12px; }
label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
input, select {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 11px 12px;
  font-size: 16px;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  font-family: inherit;
}
input[type="date"] {
  max-width: 100%;
  -webkit-appearance: none;
  appearance: none;
}
input[type="date"]::-webkit-calendar-picker-indicator {
  margin-left: 4px;
  padding: 0;
  flex-shrink: 0;
}
input[type="date"]::-webkit-date-and-time-value {
  text-align: left;
  margin: 0;
}
input:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.set-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}
.set-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.set-input-num {
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.set-input-row input {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-size: 18px;
  min-width: 0;
}
.set-x { color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
.set-row-remove {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 15px;
  padding: 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.set-row-remove:hover { color: var(--up); }
.set-row-remove[hidden] { visibility: hidden; }
.add-set-btn {
  background: none;
  border: 1px dashed var(--border);
  color: var(--accent);
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border-radius: 9px;
  padding: 9px;
  cursor: pointer;
  width: 100%;
}
.save-btn {
  width: 100%;
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  cursor: pointer;
}
.save-btn:active { opacity: 0.85; }

.compare-box {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.5;
}
.compare-box .diff-up { color: var(--up); font-weight: 700; }
.compare-box .diff-down { color: var(--down); font-weight: 700; }
.compare-box .diff-flat { color: var(--flat); font-weight: 700; }

/* rest timer */
.timer-card {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.timer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.timer-time {
  font-family: 'Oswald', sans-serif;
  font-size: 26px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.timer-time.is-done { color: var(--gold); }
.timer-presets { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.timer-preset {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 999px;
  padding: 5px 9px;
  cursor: pointer;
}
.timer-preset.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
}
.timer-bar {
  height: 6px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}
.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: var(--accent);
  border-radius: 999px;
}
.timer-bar-fill.is-done { background: var(--gold); }
.timer-controls { display: flex; gap: 8px; }
.timer-btn {
  flex: 1;
  font-family: 'Oswald', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 9px;
  padding: 10px 0;
  cursor: pointer;
}
.timer-btn-main {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  flex: 1.6;
}
.timer-reset-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Oswald', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 10px 0;
  border-radius: 9px;
  cursor: pointer;
}
.timer-reset-btn:hover, .timer-reset-btn:active { color: var(--text); background: var(--surface-alt); }
@media (prefers-reduced-motion: no-preference) {
  .timer-bar-fill { transition: width 1s linear, background 0.3s ease; }
}

/* view tabs */
.view-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 14px;
}
.tab {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 9px 0;
  border-radius: 9px;
  cursor: pointer;
}
.tab.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
}

/* exercise accordion */
.exercise-list { display: flex; flex-direction: column; gap: 8px; }
.exercise-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.exercise-card > summary {
  list-style: none;
  cursor: pointer;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.exercise-card > summary::-webkit-details-marker { display: none; }
.exercise-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: hsl(var(--h) var(--ex-s) var(--ex-l));
  flex-shrink: 0;
}
.exercise-name {
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.exercise-spark { width: 56px; height: 24px; flex-shrink: 0; }
.exercise-spark svg { width: 100%; height: 100%; display: block; }
.exercise-latest {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  flex-shrink: 0;
}
.exercise-card[open] > summary { border-bottom: 1px solid var(--border); }
.exercise-detail { padding: 12px 14px 14px; }

<script>
const STORAGE_KEY = 'workout_records_v2';

const dateInput = document.getElementById('date');
const exerciseSelect = document.getElementById('exercise-select');
const exerciseNewInput = document.getElementById('exercise-new');
const setRowsContainer = document.getElementById('set-rows');
const addSetBtn = document.getElementById('add-set-btn');
const saveBtn = document.getElementById('save-btn');
const compareBox = document.getElementById('compare');
const toast = document.getElementById('toast');

function getCurrentExerciseName() {
  return exerciseSelect.value === '__new__' ? exerciseNewInput.value.trim() : exerciseSelect.value;
}

function addSetRow() {
  const row = document.createElement('div');
  row.className = 'set-input-row';
  row.innerHTML = `
    <span class="set-input-num"></span>
    <input type="number" class="set-w" inputmode="decimal" step="0.5" min="0" placeholder="kg">
    <span class="set-x">×</span>
    <input type="number" class="set-r" inputmode="numeric" step="1" min="0" placeholder="回">
    <button type="button" class="set-row-remove" aria-label="このセットを削除">✕</button>
  `;
  setRowsContainer.appendChild(row);
  row.querySelector('.set-w').addEventListener('input', updateCompareBox);
  row.querySelector('.set-r').addEventListener('input', updateCompareBox);
  row.querySelector('.set-row-remove').addEventListener('click', () => {
    row.remove();
    renumberSetRows();
  });
  renumberSetRows();
  return row;
}

function renumberSetRows() {
  const rows = Array.from(setRowsContainer.children);
  rows.forEach((row, i) => {
    row.querySelector('.set-input-num').textContent = i + 1;
    row.querySelector('.set-row-remove').hidden = rows.length === 1;
  });
}

function resetSetRows() {
  setRowsContainer.innerHTML = '';
  addSetRow();
}

function getSetInputs() {
  return Array.from(setRowsContainer.children)
    .map(row => ({
      weight: parseFloat(row.querySelector('.set-w').value),
      reps: parseInt(row.querySelector('.set-r').value, 10)
    }))
    .filter(s => !isNaN(s.weight) && !isNaN(s.reps));
}

addSetBtn.addEventListener('click', () => {
  const row = addSetRow();
  row.querySelector('.set-w').focus();
});
resetSetRows();

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateLabel(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const weekdays = ['日','月','火','水','木','金','土'];
  return `${m}月${d}日 (${weekdays[dt.getDay()]})`;
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function uniqueExercises(records) {
  return [...new Set(records.map(r => r.exercise))].sort((a,b) => a.localeCompare(b, 'ja'));
}
function exerciseHue(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
  return hash < 0 ? hash + 360 : hash;
}
function sortedByTime(list) {
  return list.slice().sort((a,b) => a.date === b.date ? a.id - b.id : a.date.localeCompare(b.date));
}
function prevSessionRecordFor(record, records) {
  const list = records
    .filter(r => r.exercise === record.exercise && r.date < record.date);
  const sorted = sortedByTime(list);
  return sorted.length ? sorted[sorted.length - 1] : null;
}
function isPR(record, records) {
  const priors = records.filter(r => r.exercise === record.exercise && r.id !== record.id &&
    (r.date < record.date || (r.date === record.date && r.id < record.id)));
  if (!priors.length) return false;
  return record.weight > Math.max(...priors.map(r => r.weight));
}
function diffLabel(current, prev) {
  const wDiff = current.weight - prev.weight;
  const rDiff = current.reps - prev.reps;
  const wSign = wDiff > 0 ? '+' : '';
  const rSign = rDiff > 0 ? '+' : '';
  const cls = wDiff > 0 || (wDiff === 0 && rDiff > 0) ? 'diff-up'
    : wDiff < 0 || (wDiff === 0 && rDiff < 0) ? 'diff-down' : 'diff-flat';
  const arrow = cls === 'diff-up' ? '↑' : cls === 'diff-down' ? '↓' : '→';
  return { cls, text: `${arrow} 前回比 ${wSign}${wDiff}kg / ${rSign}${rDiff}回` };
}
function sparklineSVG(values, hue) {
  if (values.length < 2) {
    return `<svg viewBox="0 0 56 24"><circle cx="28" cy="12" r="3" fill="hsl(${hue} var(--ex-s) var(--ex-l))"/></svg>`;
  }
  const w = 56, h = 24, pad = 3;
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => [
    pad + (i / (values.length - 1)) * (w - pad * 2),
    h - pad - ((v - min) / range) * (h - pad * 2)
  ]);
  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const last = pts[pts.length - 1];
  const color = `hsl(${hue} var(--ex-s) var(--ex-l))`;
  return `<svg viewBox="0 0 ${w} ${h}">
    <path d="${area}" fill="${color}" opacity="0.16"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${color}"/>
  </svg>`;
}

function renderFullChart(containerEl, records) {
  const sorted = sortedByTime(records);
  const values = sorted.map(r => r.weight);
  const w = 600, h = 240, padL = 34, padR = 10, padT = 14, padB = 26;

  if (values.length < 2) {
    const only = values[0];
    containerEl.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="detail-chart-svg">
      <circle cx="${w / 2}" cy="${h / 2}" r="5" fill="var(--accent)"/>
      <text x="${w / 2}" y="${h / 2 - 14}" text-anchor="middle" font-size="13" fill="var(--text-dim)">${only}kg (1件のみ)</text>
    </svg>`;
    return;
  }

  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const yPad = range * 0.2 || 5;
  const yMin = Math.max(0, min - yPad);
  const yMax = max + yPad;
  const innerW = w - padL - padR, innerH = h - padT - padB;

  const points = values.map((v, i) => [
    padL + (i / (values.length - 1)) * innerW,
    padT + innerH * (1 - (v - yMin) / (yMax - yMin))
  ]);

  const gridCount = 4;
  let gridHtml = '';
  for (let i = 0; i <= gridCount; i++) {
    const val = yMin + (yMax - yMin) * (i / gridCount);
    const y = padT + innerH * (1 - i / gridCount);
    gridHtml += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    gridHtml += `<text x="${padL - 6}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-dim)">${Math.round(val)}</text>`;
  }

  const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${points[points.length - 1][0].toFixed(1)},${padT + innerH} L${points[0][0].toFixed(1)},${padT + innerH} Z`;

  const labelCount = Math.min(5, sorted.length);
  const labelIdx = [...new Set(Array.from({ length: labelCount }, (_, i) =>
    Math.round(i * (sorted.length - 1) / Math.max(1, labelCount - 1))
  ))];
  const xLabelsHtml = labelIdx.map(i =>
    `<text x="${points[i][0].toFixed(1)}" y="${h - 8}" text-anchor="middle" font-size="10" fill="var(--text-dim)">${sorted[i].date.slice(5).replace('-', '/')}</text>`
  ).join('');

  const dotsHtml = points.map((p, i) => {
    const pr = isPR(sorted[i], records);
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${pr ? 4.5 : 3}" fill="${pr ? 'var(--gold)' : 'var(--accent)'}" stroke="var(--surface)" stroke-width="1.5"/>`;
  }).join('');

  containerEl.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="detail-chart-svg" preserveAspectRatio="none">
    ${gridHtml}
    <path d="${areaPath}" fill="var(--accent)" opacity="0.12"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dotsHtml}
    ${xLabelsHtml}
  </svg>`;
}

function renderDetailView(name) {
  const allRecords = loadRecords();
  const records = allRecords.filter(r => r.exercise === name);
  const sorted = sortedByTime(records);
  const latest = sorted[sorted.length - 1];
  const maxWeight = Math.max(...sorted.map(r => r.weight));

  document.getElementById('detail-title').textContent = name;
  document.getElementById('detail-pr').textContent = `${maxWeight}kg`;
  document.getElementById('detail-count').textContent = `${sorted.length}件`;
  document.getElementById('detail-latest').textContent = `${latest.weight}kg×${latest.reps}`;

  renderFullChart(document.getElementById('detail-chart'), records);

  document.getElementById('detail-history-list').innerHTML = sorted.slice().reverse().map(r => {
    const prev = prevSessionRecordFor(r, allRecords);
    const pr = isPR(r, allRecords);
    const diffHtml = prev ? (() => { const { cls, text } = diffLabel(r, prev); return `<span class="row-diff ${cls}">${text}</span>`; })() : '';
    return `
      <div class="set-row">
        <span class="dg-date" style="flex-shrink:0;">${r.date.slice(5).replace('-', '/')}</span>
        <span class="set-metrics">${r.weight}kg × ${r.reps}回</span>
        ${pr ? '<span class="pr-badge">🏆 PR</span>' : ''}
        ${diffHtml}
      </div>`;
  }).join('');
}

function showDetailView(name) {
  document.getElementById('main-view').hidden = true;
  document.getElementById('detail-view').hidden = false;
  renderDetailView(name);
  window.scrollTo(0, 0);
}

function hideDetailView() {
  document.getElementById('detail-view').hidden = true;
  document.getElementById('main-view').hidden = false;
}

document.getElementById('detail-back').addEventListener('click', hideDetailView);

function showToast(msg) {
  toast.textContent = msg;
  toast.hidden = false;
  requestAnimationFrame(() => toast.classList.add('show'));
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => { toast.hidden = true; }, 260);
  }, 2400);
}

/* backup export/import */
function buildBackupJSON() {
  return JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), records: loadRecords() }, null, 2);
}

async function downloadBackup() {
  const filename = `workout_backup_${todayStr()}.json`;
  const jsonStr = buildBackupJSON();

  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename, data: jsonStr });
      return;
    } catch (err) {
      // 拒否・未対応の場合は標準ダウンロードにフォールバック
    }
  }

  try {
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) {
    // 両方失敗しても記録自体は保存済みなので静かに諦める
  }
}

function importBackupFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const records = Array.isArray(parsed) ? parsed : parsed.records;
      if (!Array.isArray(records)) throw new Error('invalid format');
      saveRecords(records);
      renderAll();
      updateCompareBox();
      showToast('バックアップを読み込みました');
    } catch (err) {
      showToast('読み込みに失敗しました(ファイル形式を確認してください)');
    }
  };
  reader.readAsText(file);
}

/* rest timer */
const timerTimeEl = document.getElementById('timer-time');
const timerBarFillEl = document.getElementById('timer-bar-fill');
const timerToggleBtn = document.getElementById('timer-toggle');
const timerPresetsEl = document.getElementById('timer-presets');

let timerTotal = 90;
let timerRemaining = 90;
let timerInterval = null;
let timerRunning = false;
let audioCtx = null;

function formatTime(sec) {
  const clamped = Math.max(0, sec);
  const m = Math.floor(clamped / 60);
  const s = clamped % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateTimerDisplay() {
  const done = timerRemaining <= 0;
  timerTimeEl.textContent = formatTime(timerRemaining);
  timerTimeEl.classList.toggle('is-done', done);
  timerBarFillEl.classList.toggle('is-done', done);
  const ratio = timerTotal > 0 ? Math.max(0, timerRemaining) / timerTotal : 0;
  timerBarFillEl.style.width = `${ratio * 100}%`;
}

function ensureAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  return audioCtx;
}

function playTimerEndSound() {
  try {
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    [[880, 0], [1046.5, 0.4]].forEach(([freq, delay]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.3, now + delay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.3);
      osc.start(now + delay);
      osc.stop(now + delay + 0.35);
    });
  } catch {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function timerTick() {
  timerRemaining--;
  updateTimerDisplay();
  if (timerRemaining <= 0) {
    stopTimer();
    playTimerEndSound();
    showToast('⏱ 休憩終了！');
  }
}

function startTimer() {
  ensureAudioCtx();
  if (timerRemaining <= 0) timerRemaining = timerTotal;
  timerRunning = true;
  timerToggleBtn.textContent = '一時停止';
  clearInterval(timerInterval);
  timerInterval = setInterval(timerTick, 1000);
  updateTimerDisplay();
}

function pauseTimer() {
  timerRunning = false;
  timerToggleBtn.textContent = '再開';
  clearInterval(timerInterval);
}

function stopTimer() {
  timerRunning = false;
  timerToggleBtn.textContent = '開始';
  clearInterval(timerInterval);
}

function resetTimer(sec) {
  stopTimer();
  timerTotal = sec;
  timerRemaining = sec;
  updateTimerDisplay();
  Array.from(timerPresetsEl.children).forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.sec) === sec);
  });
}

timerPresetsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.timer-preset');
  if (!btn) return;
  resetTimer(Number(btn.dataset.sec));
});
timerToggleBtn.addEventListener('click', () => {
  if (timerRunning) pauseTimer();
  else startTimer();
});
document.getElementById('timer-minus').addEventListener('click', () => {
  timerRemaining = Math.max(0, timerRemaining - 15);
  updateTimerDisplay();
});
document.getElementById('timer-plus').addEventListener('click', () => {
  timerRemaining += 15;
  if (timerRemaining > timerTotal) timerTotal = timerRemaining;
  updateTimerDisplay();
});
document.getElementById('timer-reset').addEventListener('click', () => {
  resetTimer(timerTotal);
});

updateTimerDisplay();

function setRowsHtml(sets, allRecords) {
  return sets.map((s, i) => {
    const pr = isPR(s, allRecords);
    return `
      <div class="set-row" data-id="${s.id}">
        <span class="set-num">${i + 1}</span>
        <span class="set-metrics">${s.weight}kg × ${s.reps}回</span>
        ${pr ? '<span class="pr-badge">🏆 PR</span>' : ''}
        <button type="button" class="delete-btn" data-delete="${s.id}" aria-label="削除">✕</button>
      </div>`;
  }).join('');
}

function dateGroupHtml(date, sets, allRecords) {
  const orderedSets = sets.slice().sort((a, b) => a.id - b.id);
  const prev = prevSessionRecordFor(orderedSets[0], allRecords);
  const diffHtml = prev ? (() => { const {cls, text} = diffLabel(orderedSets[0], prev); return `<span class="row-diff ${cls}">${text}</span>`; })() : '';
  return `
    <div class="date-group">
      <div class="dg-header">
        <span class="dg-date">${date.slice(5).replace('-', '/')}</span>
        ${diffHtml}
      </div>
      <div class="dg-sets">${setRowsHtml(orderedSets, allRecords)}</div>
    </div>`;
}

function exerciseGroupHtml(name, sets, allRecords) {
  const hue = exerciseHue(name);
  const orderedSets = sets.slice().sort((a, b) => a.id - b.id);
  const prev = prevSessionRecordFor(orderedSets[0], allRecords);
  const diffHtml = prev ? (() => { const {cls, text} = diffLabel(orderedSets[0], prev); return `<span class="row-diff ${cls}">${text}</span>`; })() : '';
  return `
    <div class="exercise-group">
      <div class="eg-header">
        <span class="exercise-dot" style="--h:${hue}"></span>
        <span class="eg-name">${escapeHtml(name)}</span>
        ${diffHtml}
      </div>
      <div class="eg-sets">${setRowsHtml(orderedSets, allRecords)}</div>
    </div>`;
}

function refreshExerciseOptions(selectValue) {
  const records = loadRecords();
  const names = uniqueExercises(records);
  const keep = selectValue !== undefined ? selectValue : exerciseSelect.value;
  exerciseSelect.innerHTML = '<option value="">選択してください</option>' +
    names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('') +
    '<option value="__new__">＋ 新しい種目を追加</option>';
  exerciseSelect.value = names.includes(keep) || keep === '__new__' ? keep : '';
}

function updateStats() {
  const records = loadRecords();
  document.getElementById('stat-total').textContent = records.length;
  document.getElementById('stat-exercises').textContent = uniqueExercises(records).length;
}

function updateCompareBox() {
  const exercise = getCurrentExerciseName();
  if (!exercise) { compareBox.hidden = true; return; }
  const records = loadRecords();
  const currentDate = dateInput.value || todayStr();
  const sameExercise = sortedByTime(records.filter(r => r.exercise === exercise));
  const todaysSets = sameExercise.filter(r => r.date === currentDate);
  const prevSessionSets = sameExercise.filter(r => r.date < currentDate);
  const prev = prevSessionSets.length ? prevSessionSets[prevSessionSets.length - 1] : null;

  if (!todaysSets.length && !prev) { compareBox.hidden = true; return; }

  let html = '';
  if (todaysSets.length) {
    html += `本日のセット: ` + todaysSets.map(s => `${s.weight}kg×${s.reps}`).join(' ・ ');
  }
  if (prev) {
    if (html) html += '<br>';
    html += `前回 (${prev.date}): ${prev.weight}kg × ${prev.reps}回`;
  }
  const enteredSets = getSetInputs();
  const lastEntered = enteredSets.length ? enteredSets[enteredSets.length - 1] : null;
  if (lastEntered && prev) {
    const { cls, text } = diffLabel(lastEntered, prev);
    html += `<br><span class="${cls}">${text}</span>`;
  }
  compareBox.innerHTML = html;
  compareBox.hidden = false;
}

function renderExerciseView() {
  const records = loadRecords();
  const names = uniqueExercises(records);
  const container = document.getElementById('exercise-list-view');
  if (!names.length) {
    container.innerHTML = '<p class="empty-msg">まだ記録がありません。最初の1件を記録してみましょう。</p>';
    return;
  }
  const openNames = new Set(Array.from(container.querySelectorAll('details[open]')).map(d => d.dataset.name));
  container.innerHTML = names.map(name => {
    const list = sortedByTime(records.filter(r => r.exercise === name));
    const latest = list[list.length - 1];
    const hue = exerciseHue(name);
    const spark = sparklineSVG(list.slice(-8).map(r => r.weight), hue);
    const maxWeight = Math.max(...list.map(r => r.weight));
    const byDate = {};
    list.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
    const rows = Object.keys(byDate).sort().reverse().map(date => dateGroupHtml(date, byDate[date], records)).join('');
    const isOpen = openNames.has(name);
    return `
      <details class="exercise-card" data-name="${escapeHtml(name)}" style="--h:${hue}" ${isOpen ? 'open' : ''}>
        <summary>
          <span class="exercise-dot"></span>
          <span class="exercise-name">${escapeHtml(name)}</span>
          <span class="exercise-spark" data-detail="${escapeHtml(name)}" title="タップでグラフを拡大表示" role="button" tabindex="0">${spark}</span>
          <span class="exercise-latest">${latest.weight}kg×${latest.reps}</span>
        </summary>
        <div class="exercise-detail">
          <div class="exercise-pr">自己ベスト: <strong>${maxWeight}kg</strong> ・ 記録数 ${list.length}件</div>
          <div class="exercise-history">${rows}</div>
        </div>
      </details>`;
  }).join('');
}

function renderTimeline() {
  const records = loadRecords();
  const byDate = {};
  records.forEach(r => (byDate[r.date] = byDate[r.date] || []).push(r));
  const dates = Object.keys(byDate).sort().reverse();
  const container = document.getElementById('timeline-list');
  if (!dates.length) {
    container.innerHTML = '<p class="empty-msg">まだ記録がありません。最初の1件を記録してみましょう。</p>';
    return;
  }
  container.innerHTML = dates.map(date => {
    const dayRecords = sortedByTime(byDate[date]);
    const exNames = [...new Set(dayRecords.map(r => r.exercise))];
    const groups = exNames.map(name => exerciseGroupHtml(name, dayRecords.filter(r => r.exercise === name), records)).join('');
    return `
      <div class="session-card ${date === todayStr() ? 'is-today' : ''}">
        <div class="session-header">
          <div class="session-date">${formatDateLabel(date)}</div>
          <div class="session-meta">${exNames.length}種目 ・ ${dayRecords.length}セット</div>
        </div>
        <div class="session-body">${groups}</div>
      </div>`;
  }).join('');
}

function renderAll() {
  refreshExerciseOptions();
  updateStats();
  renderExerciseView();
  renderTimeline();
}

function handleSave() {
  const date = dateInput.value || todayStr();
  const exercise = getCurrentExerciseName();
  if (!exercise) {
    (exerciseSelect.value === '__new__' ? exerciseNewInput : exerciseSelect).focus();
    return;
  }
  const inputSets = getSetInputs();
  if (!inputSets.length) {
    const firstEmpty = setRowsContainer.querySelector('.set-w');
    if (firstEmpty) firstEmpty.focus();
    return;
  }

  const records = loadRecords();
  let anyPR = false;
  inputSets.forEach((s, i) => {
    const newRecord = { id: Date.now() + i, date, exercise, weight: s.weight, reps: s.reps };
    if (isPR(newRecord, records)) anyPR = true;
    records.push(newRecord);
  });
  saveRecords(records);

  resetSetRows();

  refreshExerciseOptions(exercise);
  exerciseNewInput.hidden = true;
  updateStats();
  renderExerciseView();
  renderTimeline();
  updateCompareBox();

  if (date === todayStr()) {
    resetTimer(timerTotal);
    startTimer();
  }

  const summary = inputSets.map(s => `${s.weight}kg×${s.reps}回`).join(' / ');
  showToast(anyPR ? `🏆 自己ベスト更新！ ${exercise} ${summary}` : `記録しました：${exercise} ${summary}`);
  downloadBackup();
}

function handleDelete(id) {
  const records = loadRecords().filter(r => r.id !== id);
  saveRecords(records);
  renderAll();
  updateCompareBox();
}

dateInput.value = todayStr();
exerciseSelect.addEventListener('change', () => {
  if (exerciseSelect.value === '__new__') {
    exerciseNewInput.hidden = false;
    exerciseNewInput.value = '';
    exerciseNewInput.focus();
  } else {
    exerciseNewInput.hidden = true;
  }
  updateCompareBox();
});
exerciseNewInput.addEventListener('input', updateCompareBox);
dateInput.addEventListener('input', updateCompareBox);
saveBtn.addEventListener('click', handleSave);
document.getElementById('backup-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) importBackupFile(file);
  e.target.value = '';
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const view = tab.dataset.view;
    document.getElementById('view-exercise').hidden = view !== 'exercise';
    document.getElementById('view-date').hidden = view !== 'date';
  });
});

document.addEventListener('click', (e) => {
  const spark = e.target.closest('[data-detail]');
  if (spark) {
    e.preventDefault();
    e.stopPropagation();
    showDetailView(spark.dataset.detail);
    return;
  }
  const btn = e.target.closest('[data-delete]');
  if (!btn) return;
  e.preventDefault();
  handleDelete(Number(btn.dataset.delete));
});
document.getElementById('exercise-list-view').addEventListener('keydown', (e) => {
  const spark = e.target.closest('[data-detail]');
  if (spark && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    showDetailView(spark.dataset.detail);
  }
});

renderAll();
</script>
